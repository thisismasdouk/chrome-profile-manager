# Builds the Mac helper as one installer (.pkg) for Intel and Apple Silicon,
# signs it with your Developer ID certificates and has Apple notarize it, so
# it opens without any "unidentified developer" warning.
#
# One-time setup (certificates, API key, secrets) is in SIGNING.md.
# Without the secrets (for example on pull requests) it builds an unsigned
# .pkg and test-installs it, to catch packaging mistakes early.
name: Build, sign and notarize Mac helper

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit the signed .pkg to docs/downloads (the website download)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "helper/**"
      - "packaging/mac/**"
      - ".github/workflows/mac-sign.yml"

permissions:
  contents: write

env:
  STORE_ID: nanlppofdmogahjbobcoaojkhlceackf
  PKG_ID: ca.techma.profilemanager.helper
  INSTALL_DIR: /Library/Application Support/ProfileManagerHelper

jobs:
  mac:
    runs-on: macos-latest
    env:
      HAS_CERTS: ${{ secrets.MAC_APP_CERT_P12 != '' && secrets.MAC_INSTALLER_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.mod

      - name: Build universal helper
        working-directory: helper
        run: |
          set -e
          for a in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$a go build -trimpath \
              -ldflags="-s -w -X main.storeExtensionID=$STORE_ID" -o ../dist/profile-helper-$a .
          done
          mkdir -p ../dist/root
          lipo -create -output ../dist/root/profile-helper ../dist/profile-helper-arm64 ../dist/profile-helper-amd64
          chmod 755 ../dist/root/profile-helper
          lipo -info ../dist/root/profile-helper
          VERSION=$(sed -n 's/.*version *= *"\(.*\)".*/\1/p' main.go | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Import certificates
        if: env.HAS_CERTS == 'true'
        env:
          APP_P12: ${{ secrets.MAC_APP_CERT_P12 }}
          INST_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -e
          KC=$RUNNER_TEMP/signing.keychain-db; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$APP_P12" | base64 --decode > $RUNNER_TEMP/app.p12
          echo "$INST_P12" | base64 --decode > $RUNNER_TEMP/inst.p12
          security import $RUNNER_TEMP/app.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security import $RUNNER_TEMP/inst.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/*.p12
          APP_ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          INST_ID=$(security find-identity -v "$KC" | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ -n "$APP_ID" ] || { echo "No 'Developer ID Application' identity in MAC_APP_CERT_P12"; exit 1; }
          [ -n "$INST_ID" ] || { echo "No 'Developer ID Installer' identity in MAC_INSTALLER_CERT_P12"; exit 1; }
          echo "Signing as: $APP_ID / $INST_ID"
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV
          echo "INST_ID=$INST_ID" >> $GITHUB_ENV

      - name: Sign helper (hardened runtime)
        if: env.HAS_CERTS == 'true'
        run: |
          set -e
          codesign --force --options runtime --timestamp --identifier "$PKG_ID" --sign "$APP_ID" dist/root/profile-helper
          codesign --verify --strict --verbose=2 dist/root/profile-helper

      - name: Build installer
        run: |
          set -e
          SIGN=(); [ "$HAS_CERTS" = "true" ] && SIGN=(--sign "$INST_ID" --timestamp)
          pkgbuild --root dist/root --scripts packaging/mac/scripts \
            --identifier "$PKG_ID" --version "$VERSION" \
            --install-location "$INSTALL_DIR" "${SIGN[@]}" \
            dist/ProfileManagerHelper-mac.pkg
          pkgutil --check-signature dist/ProfileManagerHelper-mac.pkg || true

      - name: Notarize and staple
        if: env.HAS_CERTS == 'true' && env.HAS_NOTARY == 'true'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -e
          printf '%s' "$P8" > $RUNNER_TEMP/AuthKey.p8
          xcrun notarytool submit dist/ProfileManagerHelper-mac.pkg \
            --key $RUNNER_TEMP/AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 30m --output-format json | tee $RUNNER_TEMP/notary.json
          rm $RUNNER_TEMP/AuthKey.p8
          grep -q '"status" *: *"Accepted"' $RUNNER_TEMP/notary.json || { echo "Notarization was not accepted (see log above; 'xcrun notarytool log <id>' shows why)"; exit 1; }
          xcrun stapler staple dist/ProfileManagerHelper-mac.pkg
          xcrun stapler validate dist/ProfileManagerHelper-mac.pkg
          spctl --assess --type install --verbose=2 dist/ProfileManagerHelper-mac.pkg

      - name: Test install
        run: |
          set -e
          # The runner's Chrome has never been opened, so give it a data folder.
          mkdir -p "$HOME/Library/Application Support/Google/Chrome"
          [ -f "$HOME/Library/Application Support/Google/Chrome/Local State" ] || echo '{}' > "$HOME/Library/Application Support/Google/Chrome/Local State"
          sudo installer -pkg dist/ProfileManagerHelper-mac.pkg -target / -verbose
          cat "$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts/com.profile_manager.helper.json"
          ls -l "$HOME/Library/Application Support/ChromeProfileManager/"
          [ "$HAS_CERTS" = "true" ] && codesign --verify --strict --verbose=2 "$HOME/Library/Application Support/ChromeProfileManager/profile-helper" || true

      - uses: actions/upload-artifact@v4
        with:
          name: mac-helper-pkg${{ env.HAS_CERTS != 'true' && '-UNSIGNED' || '' }}
          path: dist/ProfileManagerHelper-mac.pkg

      - name: Publish to website downloads
        if: ${{ inputs.publish && env.HAS_CERTS == 'true' && env.HAS_NOTARY == 'true' }}
        run: |
          set -e
          cp dist/ProfileManagerHelper-mac.pkg docs/downloads/ProfileManagerHelper-mac.pkg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/ProfileManagerHelper-mac.pkg
          git commit -m "Publish signed and notarized Mac helper" || { echo "No change"; exit 0; }
          git push

      - name: Clean up keychain
        if: always() && env.HAS_CERTS == 'true'
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
